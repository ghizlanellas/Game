<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>PULSE // Neon Dodge</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #07090f;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: pointer;
    }

    .hud {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      padding: 24px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 10;
    }

    .stat-group {
      display: flex;
      gap: 28px;
    }

    .stat {
      display: flex;
      flex-direction: column;
    }

    .stat-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      opacity: 0.5;
    }

    .stat-value {
      font-size: 26px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    button.icon-btn {
      pointer-events: auto;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: inherit;
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: transform 0.15s ease, background 0.2s ease;
    }

    button.icon-btn:hover {
      background: rgba(255, 255, 255, 0.16);
      transform: translateY(-1px);
    }

    .hint {
      position: fixed;
      bottom: 26px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      opacity: 0.5;
      pointer-events: none;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="hud">
    <div class="stat-group">
      <div class="stat">
        <span class="stat-label">Score</span>
        <span class="stat-value" id="scoreEl">0</span>
      </div>
      <div class="stat">
        <span class="stat-label">Best</span>
        <span class="stat-value" id="bestEl">0</span>
      </div>
    </div>
    <button class="icon-btn" id="soundBtn">Sound: On</button>
  </div>

  <div class="hint" id="hintEl">Hold Space or Click & Hold to rise</div>
  <canvas id="canvas"></canvas>

  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.getElementById("scoreEl");
    const bestEl = document.getElementById("bestEl");
    const soundBtn = document.getElementById("soundBtn");
    const hintEl = document.getElementById("hintEl");

    // Web Audio Synthesizer
    let audioCtx = null;
    let soundOn = true;

    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();
    }

    function playTone(freq, type, duration, vol = 0.15) {
      if (!soundOn) return;
      initAudio();
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, now);
      osc.frequency.exponentialRampToValueAtTime(freq * 1.15, now + duration);
      gain.gain.setValueAtTime(vol, now);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + duration);
    }

    function playCrash() {
      if (!soundOn) return;
      initAudio();
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "sawtooth";
      osc.frequency.setValueAtTime(160, now);
      osc.frequency.exponentialRampToValueAtTime(38, now + 0.4);
      gain.gain.setValueAtTime(0.25, now);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.42);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.45);
    }

    soundBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      soundOn = !soundOn;
      soundBtn.textContent = `Sound: ${soundOn ? "On" : "Off"}`;
      if (soundOn) initAudio();
    });

    // Resize handling
    let W = 0, H = 0;
    function resize() {
      const dpr = window.devicePixelRatio || 1;
      W = window.innerWidth;
      H = window.innerHeight;
      canvas.width = W * dpr;
      canvas.height = H * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener("resize", resize);
    resize();

    // Game variables
    let state = "START"; // START, PLAY, OVER
    let score = 0;
    let best = parseInt(localStorage.getItem("pulse_dodge_best") || "0", 10);
    bestEl.textContent = best;

    let hue = 190;
    let holding = false;
    let shake = 0;

    const player = {
      x: 0,
      y: 0,
      vy: 0,
      radius: 11,
      trail: []
    };

    let gates = [];
    let orbs = [];
    let particles = [];
    let gateTimer = 0;
    let speed = 320;

    function resetGame() {
      score = 0;
      scoreEl.textContent = "0";
      speed = 320;
      player.x = Math.min(180, W * 0.24);
      player.y = H * 0.5;
      player.vy = 0;
      player.trail = [];
      gates = [];
      orbs = [];
      particles = [];
      gateTimer = 0.4;
      state = "PLAY";
      hintEl.textContent = "Hold Space or Click & Hold to rise";
      playTone(440, "sine", 0.15);
    }

    function spawnExplosion(x, y, colorHue, count = 20) {
      for (let i = 0; i < count; i++) {
        const ang = Math.random() * Math.PI * 2;
        const spd = 80 + Math.random() * 260;
        particles.push({
          x,
          y,
          vx: Math.cos(ang) * spd,
          vy: Math.sin(ang) * spd,
          life: 1,
          decay: 1.6 + Math.random() * 0.8,
          size: 2.5 + Math.random() * 3.5,
          hue: (colorHue + (Math.random() - 0.5) * 60 + 360) % 360
        });
      }
    }

    function spawnGate() {
      const gapHeight = Math.max(135, 220 - score * 2.2);
      const margin = 80;
      const gapY = margin + Math.random() * (H - margin * 2 - gapHeight);
      const gateHue = (hue + 40) % 360;

      gates.push({
        x: W + 40,
        width: 18,
        gapY,
        gapHeight,
        passed: false,
        hue: gateHue
      });

      // 65% chance to spawn a bonus orb between gates
      if (Math.random() < 0.65) {
        orbs.push({
          x: W + 210,
          y: margin + Math.random() * (H - margin * 2),
          radius: 9,
          hue: (gateHue + 140) % 360,
          pulse: 0
        });
      }
    }

    // Input handlers
    function onPressStart(e) {
      if (e.type === "keydown" && e.code !== "Space") return;
      if (e.type === "keydown") e.preventDefault();
      holding = true;
      if (state === "START" || state === "OVER") {
        resetGame();
      }
    }

    function onPressEnd(e) {
      if (e.type === "keyup" && e.code !== "Space") return;
      holding = false;
    }

    window.addEventListener("keydown", onPressStart);
    window.addEventListener("keyup", onPressEnd);
    canvas.addEventListener("pointerdown", onPressStart);
    window.addEventListener("pointerup", onPressEnd);

    // Main loop
    let last = performance.now();
    function loop(now) {
      const dt = Math.min(0.05, (now - last) / 1000);
      last = now;

      hue = (hue + dt * 35) % 360;
      if (shake > 0) shake = Math.max(0, shake - dt * 35);

      if (state === "START") {
        player.x = Math.min(180, W * 0.24);
        player.y = H * 0.5 + Math.sin(now * 0.004) * 28;
        player.trail.push({ x: player.x, y: player.y, hue });
        if (player.trail.length > 26) player.trail.shift();
      } else if (state === "PLAY") {
        // Physics: upward thrust when holding, gravity otherwise
        const thrust = -1350;
        const gravity = 1150;
        player.vy += (holding ? thrust : gravity) * dt;
        player.vy = Math.max(-520, Math.min(520, player.vy));
        player.y += player.vy * dt;

        // Trail
        player.trail.push({ x: player.x, y: player.y, hue });
        if (player.trail.length > 28) player.trail.shift();
        for (const t of player.trail) t.x -= speed * 0.45 * dt;

        // Spawn gates
        gateTimer -= dt;
        if (gateTimer <= 0) {
          spawnGate();
          gateTimer = Math.max(1.05, 1.65 - score * 0.015);
        }

        // Update gates & check collisions
        for (let i = gates.length - 1; i >= 0; i--) {
          const g = gates[i];
          g.x -= speed * dt;

          // Score when passing gate
          if (!g.passed && g.x + g.width < player.x) {
            g.passed = true;
            score += 1;
            scoreEl.textContent = score;
            speed = Math.min(640, 320 + score * 6);
            hue = g.hue;
            playTone(523.25 + (score % 8) * 45, "triangle", 0.14);
            if (score > best) {
              best = score;
              bestEl.textContent = best;
              localStorage.setItem("pulse_dodge_best", best);
            }
          }

          // Collision check with top or bottom laser bar
          const withinX = player.x + player.radius > g.x && player.x - player.radius < g.x + g.width;
          const hitTop = player.y - player.radius < g.gapY;
          const hitBottom = player.y + player.radius > g.gapY + g.gapHeight;

          if (withinX && (hitTop || hitBottom)) {
            triggerGameOver();
          }

          if (g.x + g.width < -50) gates.splice(i, 1);
        }

        // Update bonus orbs
        for (let i = orbs.length - 1; i >= 0; i--) {
          const o = orbs[i];
          o.x -= speed * dt;
          o.pulse += dt * 6;

          const dist = Math.hypot(player.x - o.x, player.y - o.y);
          if (dist < player.radius + o.radius + 4) {
            score += 2;
            scoreEl.textContent = score;
            if (score > best) {
              best = score;
              bestEl.textContent = best;
              localStorage.setItem("pulse_dodge_best", best);
            }
            spawnExplosion(o.x, o.y, o.hue, 16);
            playTone(784, "sine", 0.2, 0.2);
            orbs.splice(i, 1);
            continue;
          }

          if (o.x < -40) orbs.splice(i, 1);
        }

        // Ceiling / Floor collision
        if (player.y - player.radius < 0 || player.y + player.radius > H) {
          triggerGameOver();
        }
      }

      // Update particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vx *= 0.94;
        p.vy *= 0.94;
        p.life -= p.decay * dt;
        if (p.life <= 0) particles.splice(i, 1);
      }

      draw();
      requestAnimationFrame(loop);
    }

    function triggerGameOver() {
      state = "OVER";
      shake = 14;
      spawnExplosion(player.x, player.y, hue, 36);
      playCrash();
      hintEl.textContent = "Click or press Space to play again";
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);
      ctx.save();

      if (shake > 0) {
        ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
      }

      // Subtle background grid
      ctx.strokeStyle = "rgba(255, 255, 255, 0.03)";
      ctx.lineWidth = 1;
      const gridSize = 48;
      for (let x = 0; x < W; x += gridSize) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, H);
        ctx.stroke();
      }
      for (let y = 0; y < H; y += gridSize) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(W, y);
        ctx.stroke();
      }

      // Draw Laser Gates
      for (const g of gates) {
        ctx.save();
        ctx.fillStyle = `hsl(${g.hue}, 95%, 60%)`;
        ctx.shadowColor = `hsl(${g.hue}, 95%, 60%)`;
        ctx.shadowBlur = 18;

        // Top pillar
        ctx.beginPath();
        ctx.roundRect(g.x, -10, g.width, g.gapY + 10, 8);
        ctx.fill();

        // Bottom pillar
        ctx.beginPath();
        ctx.roundRect(g.x, g.gapY + g.gapHeight, g.width, H - (g.gapY + g.gapHeight) + 10, 8);
        ctx.fill();
        ctx.restore();
      }

      // Draw Bonus Orbs
      for (const o of orbs) {
        const r = o.radius + Math.sin(o.pulse) * 2.5;
        ctx.save();
        ctx.beginPath();
        ctx.arc(o.x, o.y, r, 0, Math.PI * 2);
        ctx.fillStyle = `hsl(${o.hue}, 100%, 65%)`;
        ctx.shadowColor = `hsl(${o.hue}, 100%, 65%)`;
        ctx.shadowBlur = 16;
        ctx.fill();

        ctx.beginPath();
        ctx.arc(o.x, o.y, r * 0.45, 0, Math.PI * 2);
        ctx.fillStyle = "#ffffff";
        ctx.fill();
        ctx.restore();
      }

      // Draw Player Rainbow Ribbon Trail
      if (player.trail.length > 1) {
        for (let i = 1; i < player.trail.length; i++) {
          const p0 = player.trail[i - 1];
          const p1 = player.trail[i];
          const ratio = i / player.trail.length;
          ctx.beginPath();
          ctx.moveTo(p0.x, p0.y);
          ctx.lineTo(p1.x, p1.y);
          ctx.strokeStyle = `hsla(${p1.hue}, 100%, 62%, ${ratio * 0.65})`;
          ctx.lineWidth = player.radius * 1.6 * ratio;
          ctx.lineCap = "round";
          ctx.stroke();
        }
      }

      // Draw Player Orb
      if (state !== "OVER") {
        ctx.save();
        ctx.beginPath();
        ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
        ctx.fillStyle = "#ffffff";
        ctx.shadowColor = `hsl(${hue}, 100%, 60%)`;
        ctx.shadowBlur = 20;
        ctx.fill();
        ctx.restore();
      }

      // Draw Particles
      for (const p of particles) {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
        ctx.fillStyle = `hsla(${p.hue}, 100%, 64%, ${Math.max(0, p.life)})`;
        ctx.fill();
      }

      // Center Overlays for Start / Game Over
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      if (state === "START") {
        ctx.fillStyle = "#ffffff";
        ctx.font = "800 42px -apple-system, BlinkMacSystemFont, sans-serif";
        ctx.fillText("PULSE", W / 2, H / 2 - 18);
        ctx.font = "600 13px -apple-system, BlinkMacSystemFont, sans-serif";
        ctx.globalAlpha = 0.6;
        ctx.fillText("HOLD SPACE OR CLICK TO FLY", W / 2, H / 2 + 18);
        ctx.globalAlpha = 1;
      } else if (state === "OVER") {
        ctx.fillStyle = "#ff4d6d";
        ctx.font = "700 14px -apple-system, BlinkMacSystemFont, sans-serif";
        ctx.fillText("CRASHED", W / 2, H / 2 - 42);

        ctx.fillStyle = "#ffffff";
        ctx.font = "800 60px -apple-system, BlinkMacSystemFont, sans-serif";
        ctx.fillText(score, W / 2, H / 2 + 2);

        ctx.font = "600 13px -apple-system, BlinkMacSystemFont, sans-serif";
        ctx.globalAlpha = 0.6;
        ctx.fillText("CLICK OR SPACE TO RETRY", W / 2, H / 2 + 44);
        ctx.globalAlpha = 1;
      }

      ctx.restore();
    }

    requestAnimationFrame(loop);
  </script>
</body>
</html>
